name: Publish CloudGuard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'projects/cloud-posture-dashboard/**'
      - 'projects/cybersecurity-portfolio/**'
      - '.github/workflows/cloudguard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudguard-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate dashboard source
        run: |
          node --check projects/cloud-posture-dashboard/app.mjs
          node --check projects/cloud-posture-dashboard/data.mjs
          node --check projects/cloud-posture-dashboard/logic.mjs
          node --test projects/cloud-posture-dashboard/tests/*.test.mjs
          node --check projects/cybersecurity-portfolio/script.js
          node --test projects/cybersecurity-portfolio/tests/*.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage public dashboard files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp projects/cloud-posture-dashboard/index.html _site/index.html
          cp projects/cloud-posture-dashboard/styles.css _site/styles.css
          cp projects/cloud-posture-dashboard/app.mjs _site/app.mjs
          cp projects/cloud-posture-dashboard/data.mjs _site/data.mjs
          cp projects/cloud-posture-dashboard/logic.mjs _site/logic.mjs
          mkdir -p _site/portfolio
          cp projects/cybersecurity-portfolio/index.html _site/portfolio/index.html
          cp projects/cybersecurity-portfolio/styles.css _site/portfolio/styles.css
          cp projects/cybersecurity-portfolio/script.js _site/portfolio/script.js
          cp projects/cybersecurity-portfolio/favicon.svg _site/portfolio/favicon.svg
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/app.mjs
          test -s _site/data.mjs
          test -s _site/logic.mjs
          test -s _site/styles.css
          test -s _site/portfolio/index.html
          test -s _site/portfolio/styles.css
          test -s _site/portfolio/script.js
          test -s _site/portfolio/favicon.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
